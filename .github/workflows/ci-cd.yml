name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check common services

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Unit tests (no infra required)
        run: pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Bring up the full stack
        run: docker compose up --build -d

      - name: Wait for payment-api to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "payment-api is up"; exit 0
            fi
            echo "waiting for payment-api... ($i/60)"; sleep 5
          done
          echo "payment-api never became healthy"; docker compose logs; exit 1

      - name: Run integration tests (financial correctness, idempotency, concurrency)
        run: pytest tests/integration -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [payment-api, ledger-service, fraud-engine, reconciliation-service, outbox-publisher]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t scan-target:${{ matrix.service }} .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ matrix.service }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # report-only for now; flip to "1" to fail the build once triaged

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive

  build-and-push:
    needs: [integration-tests, security-scan, terraform-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [payment-api, ledger-service, fraud-engine, reconciliation-service, outbox-publisher]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production  # requires a manual approval gate configured in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig.yaml

      - name: Set image tags
        run: |
          for svc in payment-api ledger-service fraud-engine reconciliation-service outbox-publisher; do
            sed -i "s|IMAGE_TAG_PLACEHOLDER_${svc//-/_}|${{ github.sha }}|g" infra/k8s/${svc}-deployment.yaml
          done

      - name: Apply manifests and wait for rollout
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl apply -f infra/k8s/
          for svc in payment-api ledger-service fraud-engine reconciliation-service outbox-publisher; do
            kubectl rollout status deployment/$svc -n fintech --timeout=180s
          done
