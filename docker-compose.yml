
# LOCAL DEV ONLY: the secrets below (x-shared-secrets) are checked-in
# defaults for a laptop demo. Production uses Kubernetes Secrets sourced
# from AWS Secrets Manager — see infra/k8s/00-namespace.yaml and
# docs/adr/ADR-010-auth.md. Never reuse these values anywhere real.
x-shared-secrets: &shared-secrets
  SERVICE_AUTH_SECRET: "local-dev-only-secret-DO-NOT-USE-IN-PROD"
  WEBHOOK_SECRET: "local-dev-only-webhook-secret-DO-NOT-USE-IN-PROD"
  VALID_API_KEYS: "demo-key-local-only"

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    restart: unless-stopped
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  ledger-service:
    restart: unless-stopped
    build: { context: ., dockerfile: services/ledger-service/Dockerfile }
    environment:
      <<: *shared-secrets
      DATABASE_URL: postgresql+psycopg2://fintech:fintech@postgres:5432/fintech
      REQUIRE_SERVICE_AUTH: "true"
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  fraud-engine:
    restart: unless-stopped
    build: { context: ., dockerfile: services/fraud-engine/Dockerfile }
    environment:
      <<: *shared-secrets
      REDIS_URL: redis://redis:6379/0
      REQUIRE_SERVICE_AUTH: "true"
    ports: ["8002:8000"]
    depends_on:
      redis: { condition: service_healthy }

  payment-api:
    restart: unless-stopped
    build: { context: ., dockerfile: services/payment-api/Dockerfile }
    environment:
      <<: *shared-secrets
      FRAUD_ENGINE_URL: http://fraud-engine:8000
      LEDGER_SERVICE_URL: http://ledger-service:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg2://fintech:fintech@postgres:5432/fintech
      REDIS_URL: redis://redis:6379/0
      REQUIRE_API_KEY: "true"
      RATE_LIMIT_PER_MIN: "100"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      fraud-engine: { condition: service_started }
      ledger-service: { condition: service_started }
      kafka: { condition: service_started }

  reconciliation-service:
    restart: unless-stopped
    build: { context: ., dockerfile: services/reconciliation-service/Dockerfile }
    environment:
      <<: *shared-secrets
      DATABASE_URL: postgresql+psycopg2://fintech:fintech@postgres:5432/fintech
      LEDGER_SERVICE_URL: http://ledger-service:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REQUIRE_SERVICE_AUTH: "true"
    ports: ["8003:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      ledger-service: { condition: service_started }

  outbox-publisher:
    restart: unless-stopped
    build: { context: ., dockerfile: services/outbox-publisher/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg2://fintech:fintech@postgres:5432/fintech
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PAYMENT_API_URL: http://localhost:8000
        VITE_LEDGER_API_URL: http://localhost:8001
        VITE_RECON_API_URL: http://localhost:8003
        VITE_CLIENT_API_KEY: demo-key-local-only
        VITE_SERVICE_AUTH_SECRET: local-dev-only-secret-DO-NOT-USE-IN-PROD
    ports: ["8090:80"]
    depends_on:
      - payment-api
      - ledger-service
      - reconciliation-service


volumes:
  pgdata:
