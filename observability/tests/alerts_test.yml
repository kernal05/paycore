rule_files:
  - ../platform-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="outbox-publisher", instance="outbox-publisher:8000"}'
        values: '1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m          # down for 1m: still pending
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 6m          # down for >2m: firing
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: outbox-publisher
              instance: "outbox-publisher:8000"
            exp_annotations:
              summary: "A scrape target is down"
              runbook: "docs/RUNBOOK.md#target-down"
