global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerting-rules.yml
  - /etc/prometheus/postgres-alerts.yml
  - /etc/prometheus/platform-alerts.yml

scrape_configs:
  - job_name: "payment-api"
    static_configs: [{ targets: ["payment-api:8000"] }]
  - job_name: "ledger-service"
    static_configs: [{ targets: ["ledger-service:8000"] }]
  - job_name: "fraud-engine"
    static_configs: [{ targets: ["fraud-engine:8000"] }]
  - job_name: "reconciliation-service"
    static_configs: [{ targets: ["reconciliation-service:8000"] }]
  - job_name: "outbox-publisher"
    static_configs: [{ targets: ["outbox-publisher:8000"] }]
  - job_name: "postgres-exporter"
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: "prometheus"
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: "alertmanager"
    static_configs: [{ targets: ["alertmanager:9093"] }]
