# Observability stack. Loaded locally via COMPOSE_FILE in .env; CI uses docker-compose.yml alone.
# All ports are bound to loopback only.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability:/etc/prometheus:ro
      - prom_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am_data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]

  alert-webhook:
    # Local stand-in for Slack/PagerDuty: logs every alert Alertmanager delivers.
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/webhook_logger.py"]
    volumes:
      - ./observability/webhook_logger.py:/app/webhook_logger.py:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      # local-dev credentials only (see docs/adr/ADR-010-auth.md)
      DATA_SOURCE_NAME: "postgresql://fintech:fintech@postgres:5432/fintech?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  prom_data:
  am_data:
  grafana_data:
